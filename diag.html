<!DOCTYPE html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>FieldBid · Diagnóstico de fotos</title>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
<style>
body{font-family:system-ui,sans-serif;background:#0d1117;color:#e6edf3;margin:0;padding:14px;font-size:13px}
h1{font-size:17px;margin:0 0 2px}.sub{color:#7d8590;font-size:12px;margin-bottom:12px}
.box{background:#161b22;border:1px solid #30363d;border-radius:12px;padding:12px;margin-bottom:12px}
.box h2{font-size:13px;margin:0 0 8px;color:#f0a02c;text-transform:uppercase;letter-spacing:.5px}
table{width:100%;border-collapse:collapse;font-size:12px}td,th{padding:5px 4px;border-bottom:1px solid #21262d;text-align:left}th{color:#7d8590;font-weight:600}
.r{text-align:right;font-variant-numeric:tabular-nums}.ok{color:#3fb950}.bad{color:#f85149;font-weight:700}.warn{color:#f0a02c}
.bar{height:10px;border-radius:99px;background:#21262d;overflow:hidden;margin:6px 0}.bar i{display:block;height:100%}
</style></head><body>
<h1>FieldBid · Diagnóstico de fotos</h1>
<div class="sub">Só leitura. Não altera nenhum dado. Tire uma foto desta tela e mande para o Claude.</div>
<div class="box" id="b1"><h2>1 · Espaço do navegador</h2><div id="s1">Calculando…</div></div>
<div class="box" id="b2"><h2>2 · Fotos no celular (FieldBid)</h2><div id="s2">Lendo…</div></div>
<div class="box" id="b3"><h2>3 · Fotos na nuvem</h2><div id="s3">Conectando…</div></div>
<div class="box" id="b4"><h2>4 · Projetos fora do índice (busca direta)</h2><div id="s4">Aguardando…</div></div>
<script>
function each(a,f){ for(var i=0;i<a.length;i++) f(a[i],i); }
function esc(s){return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}
function kb(n){return n>=1048576?(n/1048576).toFixed(2)+' MB':Math.round(n/1024)+' KB';}
function setH(id,h){document.getElementById(id).innerHTML=h;}
// ── 1. storage usage (chars ×2 = bytes, as browsers store UTF-16) ──
var groups={}, total=0, keys=[];
for(var i=0;i<localStorage.length;i++){ var k=localStorage.key(i), v=localStorage.getItem(k)||''; var b=(k.length+v.length)*2; total+=b; keys.push([k,b]);
  var g=/^fb6_/.test(k)?'FieldBid':(/^wl_/.test(k)?'WorkLog':(/^ff_|finance/i.test(k)?'FinanceFlow':(/^gi|maint/i.test(k)?'GI Maintenance':(/faz/i.test(k)?'Fazenda':'Outros')))); groups[g]=(groups[g]||0)+b; }
keys.sort(function(a,b){return b[1]-a[1];});
// free space probe: write a temporary key in growing blocks, then remove it
var free=0, probeKey='__diag_probe__', chunk='x'.repeat(102400);
try{ var s=''; for(var t=0;t<120;t++){ s+=chunk; localStorage.setItem(probeKey,s); free=s.length*2; } }catch(e){}
try{ localStorage.removeItem(probeKey); }catch(e){}
var cap=total+free, pct=Math.min(100,100*total/cap);
var h='<div>Usado: <b>'+kb(total)+'</b> · Livre: <b class="'+(free<307200?'bad':free<1048576?'warn':'ok')+'">'+(free>=12288000?'mais de 12 MB':kb(free))+'</b></div>';
h+='<div class="bar"><i style="width:'+pct.toFixed(1)+'%;background:'+(pct>92?'#f85149':pct>75?'#f0a02c':'#3fb950')+'"></i></div><table><tr><th>App</th><th class="r">Ocupa</th></tr>';
each(Object.keys(groups).sort(function(a,b){return groups[b]-groups[a];}),function(g){ h+='<tr><td>'+g+'</td><td class="r">'+kb(groups[g])+'</td></tr>'; });
h+='</table><div class="sub" style="margin-top:8px">Maiores itens:</div><table>'; each(keys.slice(0,6),function(k){ h+='<tr><td>'+esc(k[0])+'</td><td class="r">'+kb(k[1])+'</td></tr>'; }); h+='</table>';
setH('s1',h);
// ── 2. photos stored on this phone ──
function countPh(arr){ var n=0,c=0; each(arr||[],function(o){ if(o&&Array.isArray(o.photos)) n+=o.photos.length; if(o&&o._phN) c+=o._phN; }); return [n,c]; }
var projs=[]; try{ projs=JSON.parse(localStorage.getItem('fb6_projs')||'[]'); }catch(e){}
var fa=[],ei=[],qi={}; try{fa=JSON.parse(localStorage.getItem('fb6_fa')||'[]');}catch(e){} try{ei=JSON.parse(localStorage.getItem('fb6_ei')||'[]');}catch(e){} try{qi=JSON.parse(localStorage.getItem('fb6_qi')||'{}');}catch(e){}
var local={}, claimed=[];
var h2='<table><tr><th>Projeto</th><th class="r">Fotos</th><th class="r">Deveria ter</th></tr>', tl=0;
each(projs,function(p){ if(!p) return; var a=countPh(p.areas), e=countPh(p.estItems), n=a[0]+e[0], c=a[1]+e[1]; local[p.id]={n:n,name:p.name}; tl+=n;
  if(c>n) claimed.push(p.id);
  if(n||c) h2+='<tr><td>'+esc(p.name||p.id)+'</td><td class="r '+(c>n?'bad':'ok')+'">'+n+'</td><td class="r">'+(c||'')+'</td></tr>'; });
h2+='</table><div style="margin-top:8px">Projetos: <b>'+projs.length+'</b> · Fotos na lista: <b>'+tl+'</b> · Projeto aberto: <b>'+(countPh(fa)[0]+countPh(ei)[0])+'</b> fotos · Marcas de foto: <b>'+Object.keys((qi&&qi.photoMarks)||{}).length+'</b></div>';
h2+='<div class="sub">"Deveria ter" = quantas fotos o app registrou que o projeto tinha antes de ir para a nuvem.</div>';
setH('s2',h2);
// ── 3. photos in the cloud (read-only) ──
try{
  firebase.initializeApp({apiKey:"AIzaSyBHQWTKirZQZ_ua9chnaLy7lnXi0KDygPA",authDomain:"work-log-5aa9f.firebaseapp.com",projectId:"work-log-5aa9f",storageBucket:"work-log-5aa9f.firebasestorage.app",messagingSenderId:"919924820811",appId:"1:919924820811:web:00460b91d51023d718b6ce"});
  var db=firebase.firestore(); try{ db.settings({experimentalAutoDetectLongPolling:true,merge:true}); }catch(e){}
  var started=false;
  firebase.auth().onAuthStateChanged(function(u){
    if(!u){ setH('s3','Entrando…'); firebase.auth().signInAnonymously().catch(function(e){ setH('s3','<span class="bad">Não conectou: '+esc(e.message)+'</span>'); }); return; }
    if(started) return; started=true;
    var col=db.collection('fieldbid');
    col.doc('ph__index').get().then(function(d){
      var ids=[]; try{ ids=JSON.parse((d.exists&&d.data().ids)||'[]'); }catch(e){}
      var h3='<div>Índice da nuvem: <b>'+ids.length+'</b> projeto(s) com fotos</div><table><tr><th>Projeto</th><th class="r">Nuvem</th><th class="r">Celular</th></tr>';
      var chain=Promise.resolve(), tot=0;
      each(ids,function(id){ chain=chain.then(function(){ return col.doc('ph__'+id+'__0').get().then(function(d0){
          if(!d0.exists){ h3+='<tr><td>'+esc((local[id]||{}).name||id)+'</td><td class="r bad">0</td><td class="r">'+((local[id]||{}).n||0)+'</td></tr>'; return; }
          var n=(d0.data().n)||1, maps=[]; try{ maps.push(JSON.parse(d0.data().data||'{}')); }catch(e){}
          var sub=Promise.resolve(); for(var c=1;c<n;c++){ (function(ci){ sub=sub.then(function(){ return col.doc('ph__'+id+'__'+ci).get().then(function(dd){ if(dd.exists){ try{ maps.push(JSON.parse(dd.data().data||'{}')); }catch(e){} } }); }); })(c); }
          return sub.then(function(){ var cnt=0; each(maps,function(m){ for(var k in m) if(Array.isArray(m[k])) cnt+=m[k].length; }); tot+=cnt; var loc=(local[id]||{}).n||0;
            h3+='<tr><td>'+esc((local[id]||{}).name||id)+'</td><td class="r '+(cnt?'ok':'bad')+'">'+cnt+'</td><td class="r '+(loc<cnt?'warn':'')+'">'+loc+'</td></tr>'; });
        }); }); });
      return chain.then(function(){ setH('s3',h3+'</table><div style="margin-top:8px">Total na nuvem: <b>'+tot+'</b> fotos</div>');
        // 4. projects that claim photos but are NOT in the index: read their photo doc directly
        var inIdx={}; each(ids,function(x){inIdx[x]=1;});
        var todo=[]; each(claimed,function(x){ if(!inIdx[x]) todo.push(x); });
        if(!todo.length){ setH('s4','Nenhum projeto fora do índice.'); return; }
        var h4='<table><tr><th>Projeto</th><th class="r">Na nuvem</th></tr>', found=0, ch2=Promise.resolve();
        each(todo,function(id){ ch2=ch2.then(function(){ return col.doc('ph__'+id+'__0').get().then(function(d0){
            if(!d0.exists||!(d0.data()&&d0.data().data)||d0.data().data==='{}'){ h4+='<tr><td>'+esc((local[id]||{}).name||id)+'</td><td class="r bad">não existe</td></tr>'; return; }
            var n=(d0.data().n)||1, maps=[]; try{ maps.push(JSON.parse(d0.data().data||'{}')); }catch(e){}
            var sub=Promise.resolve(); for(var c=1;c<n;c++){ (function(ci){ sub=sub.then(function(){ return col.doc('ph__'+id+'__'+ci).get().then(function(dd){ if(dd.exists){ try{ maps.push(JSON.parse(dd.data().data||'{}')); }catch(e){} } }); }); })(c); }
            return sub.then(function(){ var cnt=0; each(maps,function(m){ for(var k in m) if(Array.isArray(m[k])) cnt+=m[k].length; }); found+=cnt;
              h4+='<tr><td>'+esc((local[id]||{}).name||id)+'</td><td class="r '+(cnt?'ok':'bad')+'">'+(cnt?cnt+' fotos':'vazio')+'</td></tr>'; });
          }); }); });
        return ch2.then(function(){ setH('s4',h4+'</table><div style="margin-top:8px">'+(found?'<b class="ok">'+found+' fotos existem na nuvem e podem ser recuperadas.</b>':'<b class="bad">Nenhuma foto desses projetos existe na nuvem.</b>')+'</div>'); });
      });
    }).catch(function(e){ setH('s3','<span class="bad">Erro ao ler a nuvem: '+esc(e.message)+'</span>'); });
  });
}catch(e){ setH('s3','<span class="bad">'+esc(e.message)+'</span>'); }
</script></body></html>
