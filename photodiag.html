<!DOCTYPE html>
<html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Diagnóstico Fotos</title>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:sans-serif;background:#0a0a0a;color:#f0f0f0;padding:16px}
.box{background:#111;border:1px solid #222;border-radius:14px;padding:20px;max-width:560px;margin:0 auto}
.logo{font-size:19px;font-weight:800;margin-bottom:3px}.logo span{color:#f0a02c}
.sub{color:#666;font-size:12.5px;margin-bottom:16px}
.btn{width:100%;border:none;border-radius:9px;padding:13px;font-size:14.5px;font-weight:700;cursor:pointer;margin-bottom:9px}
.b1{background:#60a5fa;color:#001}.b2{background:#f0a02c;color:#000}.btn:disabled{opacity:.5}
#log{font-size:12.5px;line-height:1.85;font-family:monospace;word-break:break-word;margin-top:12px}
.ok{color:#4ade80}.err{color:#f87171}.wait{color:#94a3b8}.info{color:#60a5fa}.warn{color:#fcd34d}
.res{margin-top:14px;padding:13px;border-radius:9px;font-size:13px;line-height:1.65;display:none}
.res.show{display:block}.good{background:#12301c;border:1px solid #4ade80;color:#a7f3c0}
.bad{background:#3a1414;border:1px solid #f87171;color:#fca5a5}
</style></head>
<body>
<div class="box">
  <div class="logo">Field<span>Bid</span> · Diagnóstico de Fotos</div>
  <div class="sub">Mostra o que está no aparelho e o que está na nuvem</div>
  <button class="btn b1" id="check">🔍 Verificar</button>
  <button class="btn b2" id="force">⬆️ Forçar backup das fotos</button>
  <button class="btn b3" id="restore" style="background:#4ade80;color:#062">⬇️ Restaurar fotos da nuvem</button>
  <div id="log"></div>
  <div class="res" id="res"></div>
</div>
<script>
var logEl=document.getElementById('log'), resEl=document.getElementById('res');
function L(m,c){logEl.innerHTML+='<div class="'+(c||'wait')+'">'+m+'</div>';}
function show(h,good){resEl.className='res show '+(good?'good':'bad');resEl.innerHTML=h;}

firebase.initializeApp({
  apiKey:"AIzaSyBHQWTKirZQZ_ua9chnaLy7lnXi0KDygPA",
  authDomain:"work-log-5aa9f.firebaseapp.com",
  projectId:"work-log-5aa9f",
  storageBucket:"work-log-5aa9f.firebasestorage.app",
  messagingSenderId:"919924820811",
  appId:"1:919924820811:web:00460b91d51023d718b6ce"
});
var db=firebase.firestore();

function auth(){ return firebase.auth().signInAnonymously(); }

// Count photos stored on this device
function localPhotoStats(){
  var projs=[]; try{ projs=JSON.parse(localStorage.getItem('fb6_projs')||'[]'); }catch(e){}
  var nProj=projs.length, withPhotos=0, total=0, bytes=0, claims=0;
  projs.forEach(function(p){
    var got=0;
    function scan(a){ if(!Array.isArray(a))return;
      a.forEach(function(o){
        if(!o||typeof o!=='object')return;
        if(o._phN)claims+=o._phN;
        if(Array.isArray(o.photos)&&o.photos.length){
          got+=o.photos.length;
          o.photos.forEach(function(s){bytes+=(s||'').length;});
        }
      });
    }
    scan(p.areas); scan(p.estItems);
    if(got){withPhotos++; total+=got;}
  });
  return {nProj:nProj, withPhotos:withPhotos, total:total, mb:(bytes/1024/1024).toFixed(2), claims:claims};
}

document.getElementById('check').addEventListener('click',function(){
  var b=this;b.disabled=true;logEl.innerHTML='';resEl.className='res';
  L('1️⃣ No APARELHO (localStorage):');
  var s=localPhotoStats();
  L('   projetos: '+s.nProj,'info');
  L('   com fotos: '+s.withPhotos+'  ·  fotos: '+s.total+'  ·  '+s.mb+' MB','info');
  if(s.claims) L('   marcados como "tinham foto" mas sem foto local: '+s.claims,'warn');
  L('');
  L('2️⃣ Autenticando...');
  auth().then(function(){
    L('   ✅ ok','ok');
    L('3️⃣ Procurando backups de foto na NUVEM...');
    return db.collection('fieldbid').get();
  }).then(function(snap){
    var ph=0, phBytes=0, dataDocs=0;
    snap.forEach(function(d){
      if(d.id.indexOf('ph__')===0){ ph++; var dd=d.data(); phBytes+=((dd&&dd.data)||'').length; }
      else dataDocs++;
    });
    L('   documentos de dados: '+dataDocs,'info');
    L('   documentos de FOTO (ph__): '+ph,'info');
    L('   tamanho das fotos na nuvem: '+(phBytes/1024/1024).toFixed(2)+' MB','info');
    L('');
    if(ph===0 && s.total>0){
      show('<b>As fotos NÃO estão na nuvem.</b><br><br>Você tem '+s.total+' foto(s) no aparelho, mas nenhum backup foi enviado. Toque em <b>Forçar backup</b> para ver o erro exato.',false);
    } else if(ph>0){
      show('<b>Existem '+ph+' documento(s) de foto na nuvem.</b><br><br>O backup está funcionando. Se as fotos somem ao limpar o cache, o problema é na restauração — me avise.',true);
    } else {
      show('Nenhuma foto no aparelho e nenhuma na nuvem. Tire uma foto num projeto e rode de novo.',false);
    }
    b.disabled=false;
  }).catch(function(e){
    L('   ❌ '+(e.code||'')+' '+(e.message||e),'err');
    show('<b>Erro ao ler a nuvem:</b><br>'+(e.code||'')+'<br>'+(e.message||e),false);
    b.disabled=false;
  });
});

document.getElementById('force').addEventListener('click',function(){
  var b=this;b.disabled=true;logEl.innerHTML='';resEl.className='res';
  L('Enviando fotos para a nuvem...');
  auth().then(function(){
    var projs=[]; try{ projs=JSON.parse(localStorage.getItem('fb6_projs')||'[]'); }catch(e){}
    var col=db.collection('fieldbid'), chain=Promise.resolve(), sent=0, errs=[];
    projs.forEach(function(proj){
      if(!proj||!proj.id)return;
      var map={};
      function walk(arr,pre){ if(!Array.isArray(arr))return;
        for(var i=0;i<arr.length;i++){var o=arr[i];
          if(o&&typeof o==='object'&&Array.isArray(o.photos)&&o.photos.length)map[pre+i+':'+(o.name||'')]=o.photos;}
      }
      walk(proj.areas,'a'); walk(proj.estItems,'e');
      if(!Object.keys(map).length)return;
      // chunk under 700KB
      var chunks=[],cur={},len=0;
      Object.keys(map).forEach(function(k){
        var l=0; map[k].forEach(function(p){l+=(p||'').length;});
        if(len>0&&len+l>700000){chunks.push(cur);cur={};len=0;}
        cur[k]=map[k]; len+=l;
      });
      if(Object.keys(cur).length)chunks.push(cur);
      chain=chain.then(function(){
        var batch=db.batch();
        chunks.forEach(function(ch,i){
          batch.set(col.doc('ph__'+proj.id+'__'+i),{data:JSON.stringify(ch),n:chunks.length,updatedAt:new Date().toISOString()});
        });
        return batch.commit().then(function(){
          sent++; L('   ✅ '+(proj.name||proj.id)+' — '+chunks.length+' pacote(s)','ok');
        }).catch(function(e){
          errs.push((proj.name||proj.id)+': '+(e.code||'')+' '+(e.message||e));
          L('   ❌ '+(proj.name||proj.id)+' — '+(e.code||'')+' '+(e.message||e),'err');
        });
      });
    });
    return chain.then(function(){
      L('');
      if(!sent&&!errs.length) show('Nenhum projeto com foto no aparelho.',false);
      else if(errs.length) show('<b>Falhou em '+errs.length+' projeto(s).</b><br><br>'+errs[0]+'<br><br>Me mande esta mensagem.',false);
      else show('<b>'+sent+' projeto(s) enviados com sucesso.</b><br><br>Agora limpe o cache e reabra o app para testar a restauração.',true);
      b.disabled=false;
    });
  }).catch(function(e){
    L('❌ '+(e.code||'')+' '+(e.message||e),'err');
    show('<b>Erro:</b> '+(e.message||e),false);
    b.disabled=false;
  });
});

document.getElementById('restore').addEventListener('click',function(){
  var b=this;b.disabled=true;logEl.innerHTML='';resEl.className='res';
  L('Buscando fotos na nuvem...');
  auth().then(function(){
    var projs=[]; try{ projs=JSON.parse(localStorage.getItem('fb6_projs')||'[]'); }catch(e){}
    if(!projs.length){ show('Nenhum projeto no aparelho.',false); b.disabled=false; return; }
    var col=db.collection('fieldbid'), chain=Promise.resolve(), restored=0, checked=0, empties=0;
    projs.forEach(function(proj){
      if(!proj||!proj.id)return;
      chain=chain.then(function(){
        return col.doc('ph__'+proj.id+'__0').get().then(function(d0){
          checked++;
          if(!d0.exists){ return; }
          var raw=(d0.data()&&d0.data().data)||'';
          if(!raw||raw==='{}'){ empties++; return; }
          var total=(d0.data().n)||1, maps=[];
          try{ maps.push(JSON.parse(raw)); }catch(e){}
          var sub=Promise.resolve();
          for(var ci=1;ci<total;ci++){(function(ix){
            sub=sub.then(function(){ return col.doc('ph__'+proj.id+'__'+ix).get().then(function(dd){
              if(dd.exists){ try{ maps.push(JSON.parse(dd.data().data||'{}')); }catch(e){} } }); });
          })(ci);}
          return sub.then(function(){
            var merged={}; maps.forEach(function(m){ for(var k in m)merged[k]=m[k]; });
            var n=0;
            function apply(arr,pre){ if(!Array.isArray(arr))return;
              for(var i=0;i<arr.length;i++){ var o=arr[i]; if(!o||typeof o!=='object')continue;
                var k=pre+i+':'+(o.name||'');
                if(merged[k]){ o.photos=merged[k]; n+=merged[k].length; } } }
            apply(proj.areas,'a'); apply(proj.estItems,'e');
            if(n){ restored+=n; L('   ✅ '+(proj.name||proj.id)+' — '+n+' foto(s)','ok'); }
            else { L('   ⚠️ '+(proj.name||proj.id)+' — doc existe mas as chaves não bateram','warn'); }
          });
        }).catch(function(e){ L('   ❌ '+(proj.name||proj.id)+': '+(e.code||'')+' '+(e.message||e),'err'); });
      });
    });
    return chain.then(function(){
      L('');
      L('projetos verificados: '+checked+'  ·  documentos vazios: '+empties,'info');
      if(restored){
        try{ localStorage.setItem('fb6_projs',JSON.stringify(projs)); }catch(e){}
        show('<b>'+restored+' foto(s) restauradas!</b><br><br>Recarregue o app para vê-las.',true);
      } else {
        show('<b>Nenhuma foto para restaurar.</b><br><br>Documentos vazios: '+empties+'.<br>Se um documento existia mas as chaves não bateram, o nome da área mudou depois do backup — me avise.',false);
      }
      b.disabled=false;
    });
  }).catch(function(e){ L('❌ '+(e.message||e),'err'); show('Erro: '+(e.message||e),false); b.disabled=false; });
});
</script>
</body></html>
